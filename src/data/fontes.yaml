- id: nova-escola-2023
  curto: Nova Escola · 2023
  tipo: reportagem
  nivel: B
  veiculo: Jovem Pan (pesquisa Nova Escola e Instituto Ame Sua Mente)
  titulo: Oito em cada dez educadores já foram vítimas de agressão no ambiente escolar, mostra pesquisa
  data: "2023"
  url: https://jovempan.com.br/brasil/oito-em-cada-dez-educadores-ja-foram-vitimas-de-agressao-no-ambiente-escolar-mostra-pesquisa/
  trecho: "80% dos professores sofreram algum tipo de agressão no ambiente escolar, com 60% relatando temer por sua integridade física ao repreender algum aluno. A violência verbal foi a mais frequente (76,1%), seguida pela violência psicológica ou moral (41,5%). Seis em cada dez professores notaram aumento da agressividade dos alunos. Os próprios alunos são responsáveis pela maioria das agressões (58,6%), seguidos por familiares (31,3%). A pesquisa ouviu 2.752 educadores."
  nota: Pesquisa da revista Nova Escola com o Instituto Ame Sua Mente, julho de 2023. Buscar o relatório original.
  acessadoEm: "2026-10-07"

