- id: talis-2024
  curto: OCDE · TALIS 2024
  tipo: reportagem
  nivel: B
  veiculo: O Povo (dados da OCDE)
  titulo: Professor brasileiro perde 21% do tempo de aula para manter disciplina
  data: "2025-10-07"
  url: https://mais.opovo.com.br/jornal/farol/2025/10/07/professor-brasileiro-perde-21-do-tempo-de-aula-para-manter-disciplina.html
  trecho: "No Brasil, os professores perdem, em média, 21% do tempo de aula para manter a ordem em sala, conforme dados da Pesquisa Internacional sobre Ensino e Aprendizagem (Talis) 2024, divulgada pela OCDE. Enquanto isso, nos países-membros da OCDE a média é menor, 15%. […] Quase a metade dos professores brasileiros (44%) relatam que são bastante interrompidos pelos alunos […] média da OCDE, que é de 18%. […] manter a disciplina em sala de aula é fonte de estresse para 63,8% dos docentes brasileiros, em comparação com a média da OCDE de 44,8%."
  nota: Buscar e citar também o relatório original da OCDE (TALIS 2024), que é fonte nível A.
  acessadoEm: "2026-10-07"

