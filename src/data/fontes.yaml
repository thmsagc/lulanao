  titulo: "Datafolha: 35% dos brasileiros se identificam com a direita e 22% com a esquerda"
  data: "2025-12"
  url: https://istoe.com.br/datafolha-mais-de-um-terco-dos-brasileiros-se-identificam-com-a-direita-e-22-com-a-esquerda
  trecho: "35% se declararam como parte do espectro da direita e 11%, da centro-direita (46% da população total, portanto, está mais à direita). No outro polo, 22% disseram ter posicionamento político à esquerda, sendo outros 7% mais ligados à centro-esquerda (29% do total). […] 2.002 pessoas, com 16 anos ou mais, em 113 municípios, entre os dias 2 e 4 de dezembro. Margem de erro de 2 pontos."
  nota: Entre os jovens de 16 a 24 anos, 30% se dizem de centro, 26% de direita e 16% de esquerda.
  acessadoEm: "2026-10-07"

