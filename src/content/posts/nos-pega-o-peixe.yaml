titulo: O MEC ensinou que errado não é erro
eixo: escola
ordem: 6
resumo: Em 2011, o MEC mandou a 484 mil alunos um livro que tratava "nós pega o peixe" como "inadequado", não como errado. Hoje, 3 em cada 10 brasileiros são analfabetos funcionais.
moeda: disciplina-excelencia
atualizadoEm: 2026-10-07
kit:
  frase: O MEC ensinou que "nós pega o peixe" não é errado. Hoje, 3 em cada 10 brasileiros são analfabetos funcionais.
  fonte: Bnews, 2011; Inaf, 2024
  face: vermelha
slides:
  - tipo: esquerda
    rotulo: MEC · governo Dilma · 2011
    frase: O MEC ensinou que falar errado não é erro.
    contexto: Um livro mandado a 484 mil alunos tratava “nós pega o peixe” como “inadequado”, e não como errado. [[livro-2011-bnews]]
    mais:
      titulo: O livro do MEC
      blocos:
        - tipo: texto
          rotulo: fato
          texto: O livro *Por uma vida melhor* foi distribuído pelo ((PNLD)) a ==484.195 alunos== de 4.236 escolas, na educação de jovens e adultos. [[livro-2011-bnews]]
        - tipo: texto
          rotulo: fato
          texto: Em vez de corrigir “nós pega o peixe”, o livro trocou “certo e errado” por “adequado e inadequado”, e alertou o aluno para o risco de sofrer ((preconceito linguístico)). [[livro-2011-bnews]]
        - tipo: texto
          rotulo: fato
          texto: O ministro da Educação, Fernando Haddad, defendeu o livro, e o MEC não o recolheu. [[livro-2011-cef]] [[livro-2011-bnews]]
        - tipo: texto
          rotulo: declaracao
          face: vermelha
          texto: Os defensores dizem que o livro também ensinava a ((norma culta)). [[livro-2011-bnews]]
  - tipo: consequencia
    frase: 40 milhões de brasileiros são analfabetos funcionais.
    contexto: São 29% da população de 15 a 64 anos. Entre os jovens, piorou, de 14% em 2018 para 16% em 2024. [[inaf-2024]]
    mais:
      titulo: Ler e escrever virou raridade
      blocos:
        - tipo: texto
          rotulo: dado
          texto: Metade dos alunos de 15 anos não tem o nível básico de leitura. [[pisa-2022]]
        - tipo: texto
          rotulo: dado
          texto: No Enem 2024, só ==12 redações== tiraram nota mil, o menor número da história. [[enem-2024]]
  - tipo: direita
    frase: Ensinar o certo não é preconceito. É dar ao pobre a chave que o rico já tem.
    contexto: O filho do rico aprende a norma culta em casa. O do pobre só tem a escola. E entrevista de emprego não aceita “nós pega”.
  - tipo: fecho
    frase: Quando a escola para de corrigir, o aluno para de aprender.
