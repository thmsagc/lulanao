titulo: Só 9%
eixo: escola
ordem: 4
resumo: De 35 países, o Brasil é o que menos respeita o professor. Só 9% acham que os alunos o respeitam.
moeda: disciplina-excelencia
atualizadoEm: 2026-10-07
kit:
  frase: De 35 países, o Brasil é o que menos respeita o professor. Só 9% acham que o aluno o respeita.
  fonte: Varkey Foundation, 2018
slides:
  - tipo: problema
    numero: { valor: 9, sufixo: "%" }
    frase: dos brasileiros acham que o aluno respeita o professor.
    contexto: De 35 países pesquisados, o Brasil ficou em último lugar. [[nsc-varkey-2018]]
    mais:
      titulo: O último lugar do mundo
      blocos:
        - tipo: texto
          rotulo: dado
          texto: A pesquisa ouviu mais de 35 mil pessoas em 35 países sobre o prestígio do professor. O Brasil ficou em ==último lugar==. [[nsc-varkey-2018]] [[varkey-gtsi]]
        - tipo: texto
          rotulo: dado
          texto: Na primeira edição, em 2013, o Brasil já estava entre os últimos. [[edweek-2013]]
  - tipo: esquerda
    frase: Com Temer, Brasil é último no ranking de prestígio do professor.
    autor: Site oficial do PT (2018)
    contexto: "O que o PT não contou: em 2013, no governo Dilma, o Brasil já estava entre os últimos. [[pt-temer-varkey]] [[edweek-2013]]"
  - tipo: direita
    frase: Professor é autoridade. E autoridade se respeita.
    contexto: O respeito começa em casa e se cobra na escola.
