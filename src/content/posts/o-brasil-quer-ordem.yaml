titulo: O Brasil pende para a direita
eixo: escola
ordem: 8
resumo: 46% dos brasileiros se colocam à direita; só 29% à esquerda. E 62% querem o celular fora da escola.
moeda: disciplina-excelencia
atualizadoEm: 2026-10-07
kit:
  frase: 46% dos brasileiros se colocam à direita. Só 29%, à esquerda.
  fonte: Datafolha, dezembro de 2025
  face: azul
slides:
  - tipo: problema
    rotulo: O que o Brasil pensa
    numero: { valor: 46, sufixo: "%" }
    frase: dos brasileiros se colocam à direita. Só 29%, à esquerda.
    contexto: Pesquisa Datafolha de dezembro de 2025, com 2.002 entrevistados em 113 cidades. [[datafolha-ideologia-2025]]
    mais:
      titulo: O retrato do Brasil
      blocos:
        - tipo: barras
          titulo: Como os brasileiros se posicionam
          itens:
            - { rotulo: Direita e centro-direita, valor: 46, destaque: true }
            - { rotulo: Esquerda e centro-esquerda, valor: 29 }
          fontes: [datafolha-ideologia-2025]
        - tipo: texto
          rotulo: dado
          texto: Entre quem tem 60 anos ou mais, 42% se dizem de direita e 25% de esquerda. Mesmo entre os jovens de 16 a 24 anos, a direita (26%) supera a esquerda (16%). [[datafolha-ideologia-2025]]
  - tipo: problema
    rotulo: O que o Brasil quer
    numero: { valor: 62, sufixo: "%" }
    frase: querem o celular fora da escola.
    contexto: E 76% acham que o aparelho atrapalha o aprendizado. [[datafolha-celular-2024]]
  - tipo: problema
    rotulo: O que o Brasil quer
    numero: { valor: 65, sufixo: "%" }
    frase: são a favor de reduzir a maioridade penal.
    contexto: E quase metade da população (49%) tem alto grau de conservadorismo. [[ipsos-conservadorismo-2025]]
  - tipo: direita
    frase: O Brasil quer ordem, respeito e consequência.
    contexto: Na escola e fora dela. Falta quem governa ouvir.
  - tipo: fecho
    frase: O Brasil é mais de direita do que a escola que ele paga.
