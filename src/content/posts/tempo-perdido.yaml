titulo: 1 em cada 5 minutos
eixo: escola
ordem: 3
resumo: Na sala de aula brasileira, 21% da aula vai para o lixo com bagunça. São 42 dias de aula jogados fora por ano.
moeda: disciplina-excelencia
atualizadoEm: 2026-10-07
kit:
  frase: Na escola brasileira, 1 em cada 5 minutos de aula vai para o lixo com bagunça. São 42 dias por ano.
  fonte: OCDE, pesquisa TALIS 2024
slides:
  - tipo: problema
    numero: { valor: 21, sufixo: "%" }
    frase: da aula vai para o lixo com bagunça.
    contexto: São 42 dias de aula jogados fora por ano. Nos países desenvolvidos, a perda é de 15%. [[talis-2024]]
    mais:
      titulo: O tempo que a bagunça rouba
      blocos:
        - tipo: barras
          titulo: Tempo de aula gasto só para manter a ordem
          itens:
            - { rotulo: Brasil, valor: 21, destaque: true }
            - { rotulo: Média da OCDE, valor: 15 }
          fontes: [talis-2024]
        - tipo: texto
          rotulo: contexto
          texto: "Conta simples: o ano letivo tem no mínimo 200 dias [[ldb-1996]]. Perder 21% do tempo equivale a cerca de ==42 dias de aula por ano==."
        - tipo: barras
          titulo: Para quem manter a disciplina é fonte de estresse
          itens:
            - { rotulo: Professores no Brasil, valor: 63.8, destaque: true }
            - { rotulo: Média da OCDE, valor: 44.8 }
          fontes: [talis-2024]
  - tipo: consequencia
    frase: 7 em cada 10 alunos não aprendem o mínimo de matemática.
    contexto: E metade não tem o nível básico de leitura. Nos países desenvolvidos, são 31% e 27%. [[pisa-2022]]
    mais:
      titulo: O boletim do país
      blocos:
        - tipo: barras
          titulo: Alunos de 15 anos abaixo do mínimo
          itens:
            - { rotulo: "Matemática, Brasil", valor: 73, destaque: true }
            - { rotulo: "Matemática, OCDE", valor: 31 }
            - { rotulo: "Leitura, Brasil", valor: 50, destaque: true }
            - { rotulo: "Leitura, OCDE", valor: 27 }
          fontes: [pisa-2022]
  - tipo: esquerda
    frase: A resposta do MEC para a bagunça é mais conversa.
    contexto: A aposta do governo é a “justiça restaurativa”, com diálogo, responsabilização e reparação. [[mec-jr-2023]]
  - tipo: direita
    frase: Sala de aula não é assembleia.
    contexto: Professor fala, aluno escuta. Quem atrapalha, responde. É o mínimo para quem quer aprender poder aprender.
  - tipo: fecho
    frase: Escola sem ordem não ensina. E quem mais perde é o filho do pobre, que só tem a escola pública.
