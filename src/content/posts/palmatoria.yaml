titulo: Escola sem regra, adulto sem limite
eixo: escola
ordem: 5
resumo: "A ciência confirma: criança sem regra e sem cobrança vai pior. Firmeza funciona, e não precisa de violência."
moeda: disciplina-excelencia
atualizadoEm: 2026-10-07
kit:
  frase: "Escola sem regra forma adulto sem limite. A ciência confirma: sem cobrança, a criança vai pior."
  fonte: Estudos de Diana Baumrind
slides:
  - tipo: problema
    frase: Escola sem regra forma adulto sem limite.
    contexto: "A ciência confirma: criança sem regra e sem cobrança vai pior na escola e tem menos autocontrole. [[baumrind-redalyc]]"
    mais:
      titulo: O que a pesquisa mostra
      blocos:
        - tipo: texto
          rotulo: fato
          texto: Pesquisas sobre como educar crianças mostram que ==ser permissivo faz mal==. Sem regra e sem cobrança, o desempenho cai e o autocontrole some. [[baumrind-redalyc]]
        - tipo: texto
          rotulo: fato
          texto: O que funciona é **exigência alta, regras claras, consequência certa e afeto**, o chamado ((estilo autoritativo|autoritativo)). [[baumrind-redalyc]]
  - tipo: esquerda
    frase: Para o patrono da educação, a aula tradicional é “educação bancária”.
    contexto: Paulo Freire, declarado patrono da educação brasileira em 2012, chamou de “bancária” a escola em que o professor transmite o saber ao aluno. [[freire-1968]] [[lei-12612-2012]]
    mais:
      titulo: Nas palavras de Freire
      blocos:
        - tipo: citacao
          face: vermelha
          texto: Na visão "bancária" da educação, o "saber" é uma doação dos que se julgam sábios aos que julgam nada saber.
          autor: Paulo Freire, Pedagogia do Oprimido (1968)
          fontes: [freire-1968]
        - tipo: texto
          rotulo: declaracao
          face: vermelha
          texto: Hoje, a resposta do MEC à indisciplina é a ((justiça restaurativa)), com diálogo e reparação. [[mec-jr-2023]]
  - tipo: direita
    rotulo: A prova
    frase: No maior teste da história, o ensino tradicional venceu.
    contexto: Num experimento com 700 mil crianças nos EUA, o ensino direto, com o professor explicando e cobrando, teve o melhor resultado em tudo. [[hattie-di]] [[hattie-2009]]
  - tipo: direita
    frase: Firmeza com afeto. Regra clara, consequência certa.
    contexto: Firmeza não é violência, e bater não educa. Mas sem cobrança também não existe educação. [[gershoff-2016]] [[baumrind-redalyc]]
  - tipo: fecho
    frase: Criança precisa de limite. A escola que não dá limite entrega à sociedade um adulto sem limite.
